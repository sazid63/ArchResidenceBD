# Questions the corpus neither answers nor declares. Reported with their top hit and never
# gated: the honest product behaviour for these needs a grounded model, which v0's law desk
# does not have (it returns `retrieved` because retrieval has no relevance floor). Closing
# them is data work (BNBC text, §58, staircase/parapet rules) plus W1.1 ranking work.
coverage_probes:
  - lang: en
    query: What is the minimum width of a staircase?
    note: no staircase-width rule in the pack; top hit is a road-width provision
  - lang: en
    query: What is the minimum height of a parapet wall?
    note: the pack mentions parapets only inside portico footnotes, never a minimum height
  - lang: en
    query: What concrete grade should a 6 storey building use?
    note: structural material rules are BNBC, not in the RAJUK pack
  - lang: bn
    query: ২০ তলা টাওয়ারে কতটি লিফট লাগবে?
    note: lift count depends on the building code and a lift study, not in the pack
