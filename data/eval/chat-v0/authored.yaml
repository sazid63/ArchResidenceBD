# Authored eval data (W1.9) — the only hand-written part of the case set.
#
# Everything here was observed to hold against the real code before it was pinned; nothing
# is aspirational. `tools/eval/build_cases.py` compiles this file together with the rule
# pack vectors and the training dataset into `cases.jsonl`, and `--check` fails if the
# compiled file drifts from its sources.
#
# RAG cases are questions the corpus can actually answer (`mode: answer`) or questions whose
# answer the pack explicitly declares missing (`mode: declared_gap`). Questions the corpus
# neither answers nor declares live under `coverage_probes`: they are reported with their top
# hit so the gap is visible, but they are not dressed up as passing cases.

rag:
  - id: rag:setback-from-boundary-en
    lang: en
    query: What is the minimum setback from the plot boundary?
    mode: answer
    docId: rajuk@2008.1:provision:s46-3-4:en
