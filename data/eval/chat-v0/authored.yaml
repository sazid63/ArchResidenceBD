# One case per deviation: patch a compliant project into three violations, register them,
# acknowledge one, restore it, and check that exactly that entry leaves the register.
register:
  - id: register:setback-deviation-roundtrip
    spec: spec/examples/new-project.json
    ops:
      - { op: add, path: /phases/0/data/setbackFrontM, value: 1.2 }
      - { op: add, path: /phases/0/data/setbackRearM, value: 2.0 }
      - { op: add, path: /phases/0/data/setbackSideLeftM, value: 1.25 }
      - { op: add, path: /phases/0/data/setbackSideRightM, value: 1.25 }
      - { op: add, path: /phases/0/data/plannedTotalFloorAreaSqm, value: 1400 }
      - { op: add, path: /phases/0/data/parkingSpaces, value: 1 }
      - { op: add, path: /building/typicalUnitAreaSqm, value: 150 }
    ruleRef: rajuk@2008.1#setback-schedule
    pointer: /phases/site-excavation/data/setbackFrontM
    restoreValue: 1.5
    entryId: dev-setback-schedule-setbackfrontm
    remainingAfterRestore:
      - dev-far-tables-plannedtotalfloorareasqm
      - dev-schedule4-parking-parkingspaces
  - id: register:far-deviation-roundtrip
    spec: spec/examples/new-project.json
    ops:
      - { op: add, path: /phases/0/data/setbackFrontM, value: 1.2 }
      - { op: add, path: /phases/0/data/setbackRearM, value: 2.0 }
      - { op: add, path: /phases/0/data/setbackSideLeftM, value: 1.25 }
      - { op: add, path: /phases/0/data/setbackSideRightM, value: 1.25 }
      - { op: add, path: /phases/0/data/plannedTotalFloorAreaSqm, value: 1400 }
      - { op: add, path: /phases/0/data/parkingSpaces, value: 1 }
      - { op: add, path: /building/typicalUnitAreaSqm, value: 150 }
    ruleRef: rajuk@2008.1#far-tables
    pointer: /phases/site-excavation/data/plannedTotalFloorAreaSqm
    restoreValue: 1170.57
    entryId: dev-far-tables-plannedtotalfloorareasqm
    remainingAfterRestore:
      - dev-setback-schedule-setbackfrontm
      - dev-schedule4-parking-parkingspaces
  - id: register:parking-deviation-roundtrip
    spec: spec/examples/new-project.json
    ops:
      - { op: add, path: /phases/0/data/setbackFrontM, value: 1.2 }
