[package]
name = "archres-app"
version = "0.1.0"
edition = "2021"
description = "The ArchResidenceBD desktop shell (Tauri + React) - the plan's §4 shell."
license = "UNLICENSED"
build = "build.rs"

[lib]
name = "archres_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
archres-bridge = { path = "crates/bridge" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[workspace]
members = ["crates/bridge"]
