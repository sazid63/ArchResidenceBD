<!-- @dsCard height=300 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: var(--paper); }
  .cover { position: relative; width: 960px; height: 300px; overflow: hidden; background: var(--paper); font-family: var(--font-ui); }
  svg { position: absolute; left: 0; top: 0; }
  .primary { fill: var(--primary); }
  .ink { fill: var(--ink); }
  .tile { fill: var(--surface-2); stroke: var(--line); }
  .ok { fill: var(--sage); }
  .warn { fill: var(--amber); }
  .bad { fill: var(--blush); }
  .hole { fill: var(--paper); }
  .name { position: absolute; left: 32px; top: 160px; max-width: 896px; margin: 0; font-size: 64px; line-height: .95; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .tag { position: absolute; left: 32px; top: 244px; max-width: 460px; margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink-soft); }
</style>
</head>
<body>
<div class="cover">
  <!--
    blocks: primary 360x112 and ink 168x112 (r-xl 18px), a surface-2 tile 208x112 (r-lg) holding three result dots, and two
    r-md 10px blocks in ok / warn: the indigo accent for actions plus the result colours people meet in every check.
    arrangement: top-band skeleton - one strip of unequal blocks from x=32 to 928, y=24..136, gaps s-4.
    pattern: a plan grid - rows of 12x12 window cut-outs (r-sm corners) at an s-6 pitch in the primary block, echoing a
    building elevation and the column grid; chosen because the system's corners are soft but never pill-round.
    scales: gaps s-4 16px, pitch s-6 24px, corners r-xl 18 / r-lg 14 / r-md 10 / r-sm 3 on the windows, inset s-8 32px.
  -->
  <svg width="960" height="160" viewBox="0 0 960 160" aria-hidden="true">
    <rect class="primary" x="32" y="24" width="360" height="112" rx="18"/>
    <g class="hole" id="windows"></g>
    <rect class="ink" x="408" y="24" width="168" height="112" rx="18"/>
    <rect class="tile" x="592" y="24.5" width="208" height="111" rx="14"/>
    <circle class="ok" cx="632" cy="80" r="14"/>
    <circle class="warn" cx="680" cy="80" r="14"/>
    <circle class="bad" cx="728" cy="80" r="14"/>
    <rect class="ok" x="816" y="24" width="112" height="52" rx="10"/>
    <rect class="warn" x="816" y="84" width="72" height="52" rx="10"/>
  </svg>
  <h1 class="name">ArchResidence</h1>
  <p class="tag">Plain, calm and exact: residential design and code checks for Bangladeshi homes, in Bangla and English.</p>
</div>
<script>
  var g = document.getElementById('windows'), ns = 'http://www.w3.org/2000/svg';
  for (var r = 0; r < 3; r++) for (var c = 0; c < 13; c++) {
    var d = document.createElementNS(ns, 'rect');
    d.setAttribute('x', 62 + c * 24); d.setAttribute('y', 42 + r * 28); d.setAttribute('width', 12); d.setAttribute('height', 12); d.setAttribute('rx', 3);
    g.appendChild(d);
  }
</script>
</body>
</html>
