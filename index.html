<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArchResidenceBD — Civil Engineering Suite for Bangladesh</title>
    <meta name="description" content="Civil engineering software for residential building design in Bangladesh with bilingual guided planning, BNBC/RAJUK compliance, NativeCAD 3D modeling, and PWD BOQ cost estimation." />
    <meta property="og:title" content="ArchResidenceBD — Civil Engineering Suite for Bangladesh" />
    <meta property="og:description" content="Civil engineering software for residential building design in Bangladesh with bilingual guided planning, BNBC/RAJUK compliance, NativeCAD 3D modeling, and PWD BOQ cost estimation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Self-hosted fonts (OFL) via tokens.css @font-face; nothing loads from the network -->
    <script>
      // Set the theme before first paint so dark-mode users never see a white flash (same rules as src/theme/theme.tsx).
      (function () {
        try {
          var hc = localStorage.getItem("archres-high-contrast") === "true";
          var t = localStorage.getItem("archres-theme");
          var dark = hc || t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = dark ? "dark" : "light";
          document.documentElement.dataset.highContrast = hc ? "true" : "false";
        } catch (e) {}
      })();
    </script>
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#2e4fa3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ArchResidenceBD" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('[PWA] Service Worker registered:', reg.scope))
            .catch((err) => console.log('[PWA] Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
