name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The CAD execution job installs FreeCAD (~minutes) and runs weekly as a bit-rot probe;
    # the offline case check runs on every push in core-tests.
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python tools/ci/py_syntax_check.py
      - name: Brand guard
        run: python tools/ci/brand_guard.py

  # The dev machine and every install are Windows (plan §1): a redirected console is cp1252,
  # not UTF-8, and `uv run --directory core` runs every tool from core/. Those two facts are
  # why the Bangla CLI crash and the relative-`--root` bug shipped unnoticed under
  # Ubuntu-only CI. This job is deliberately narrow — the console-encoding, RAG, demo and
  # freshness checks that are Windows-specific — so it stays fast.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Console encoding, RAG and demo tests
        run: uv run --directory core pytest -q tests/test_stdio.py tests/test_rag_corpus.py tests/test_rag_retrieval.py tests/test_rag_service.py tests/test_demo.py tests/test_agent_law.py tests/test_eval_run.py
      - name: Rule pack vectors (candidate honesty)
        run: uv run --directory core python ../tools/rules/eval_spec.py
      - name: RAG corpus freshness
        run: uv run --directory core python ../tools/rag/build_corpus.py --check
      - name: Rule pack render freshness
        run: uv run --directory core python ../tools/rules/render_pack.py --check

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Core tests
        run: uv run --directory core pytest -q
      - name: Training dataset freshness
        run: uv run --directory core python ../tools/training/build_chat_dataset.py --check
      - name: SFT split freshness
        run: uv run --directory core python ../tools/training/build_sft_split.py --check
      - name: Spec codegen freshness
        run: python tools/codegen/generate_spec.py --check
      - name: Interfaces codegen freshness
        run: python tools/codegen/generate_interfaces.py --check
      - name: Flow book freshness
        run: uv run --directory core python ../tools/flow/render_book.py --check
      - name: Rule pack freshness
        run: uv run --directory core python ../tools/rules/render_pack.py --check
      - name: RAG corpus freshness
        run: uv run --directory core python ../tools/rag/build_corpus.py --check
      - name: Fleet config freshness
        run: uv run --directory core python ../tools/serving/fleet.py --check
      - name: Eval case set freshness
        run: uv run --directory core python ../tools/eval/build_cases.py --check
      - name: Eval gates
        run: uv run --directory core python ../tools/eval/run_eval.py
      - name: CAD case set (offline, no engine)
        run: uv run --directory core python ../tools/cad/verify.py --check

  # Real FreeCAD, weekly and on demand. Not on every push: this is a private repository and a
  # full engine install per push would spend the monthly Actions minutes for no extra signal.
  # The Windows dev machine runs the same probe at every CAD change and records the numbers in
  # docs/spec/cad-verify-v0.md.
  cad-execution:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@v7
      - name: Install FreeCAD (headless)
        run: |
          sudo apt-get update -o Acquire::Retries=3
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 freecad
          freecadcmd --version
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Execute the committed CAD cases
        env:
          ARCHRES_FREECADCMD: /usr/bin/freecadcmd
        run: |
          uv run --directory core python ../tools/cad/verify.py --run \
            --workdir "$GITHUB_WORKSPACE/data/tmp/cad-ci" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/report.json" \
            --markdown "$GITHUB_WORKSPACE/data/tmp/cad-ci/report.md"
      - name: Upload the execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-execution-report
          path: data/tmp/cad-ci
          if-no-files-found: warn

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir app typecheck
