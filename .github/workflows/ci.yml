name: CI

on:
  push:
    branches: [develop, main, v3]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Type check, tests, audits, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npx oxlint src scripts

      - name: Dependency audit
        run: npm run audit:deps

      # Type check, unit tests (Vitest) and the geometry/plan audits.
      - name: Verify
        run: npm run verify

      - name: Mesh audit
        run: npm run audit:mesh

      - name: Exporter tests (IFC, FreeCAD)
        run: npm run test:exporters

      # Structure sweep (M4-2): invariants over every plan, height and site class; outcomes go to scripts/audits/audit-out.
      - name: Structural audit
        run: npm run audit:structural

      - name: Build
        run: npm run build

      # M7-1: first-load size budget, and the service worker + desktop config checks on the built files.
      - name: Bundle size budget
        run: npm run check:bundle

      - name: Offline check
        run: npm run test:offline

      # P1-6: the app in a real browser (first run, results, project file, language).
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
