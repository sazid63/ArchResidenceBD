name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # The CAD execution job installs FreeCAD (~minutes) and runs weekly as a bit-rot probe;
    # the offline case check runs on every push in core-tests.
    - cron: "23 4 * * 1"
  workflow_dispatch:

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python tools/ci/py_syntax_check.py
      - name: Brand guard
        run: python tools/ci/brand_guard.py
      - name: Bangla render guard
        run: python tools/ci/bangla_render_guard.py

  # The dev machine and every install are Windows (plan §1): a redirected console is cp1252,
  # not UTF-8, and `uv run --directory core` runs every tool from core/. Those two facts are
  # why the Bangla CLI crash and the relative-`--root` bug shipped unnoticed under
  # Ubuntu-only CI. This job is deliberately narrow — the console-encoding, RAG, demo and
  # freshness checks that are Windows-specific — so it stays fast.
  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Console encoding, RAG and demo tests
        run: uv run --directory core pytest -q tests/test_stdio.py tests/test_rag_corpus.py tests/test_rag_retrieval.py tests/test_rag_service.py tests/test_demo.py tests/test_agent_law.py tests/test_eval_run.py
      - name: Rule pack vectors (candidate honesty)
        run: uv run --directory core python ../tools/rules/eval_spec.py
      - name: RAG corpus freshness
        run: uv run --directory core python ../tools/rag/build_corpus.py --check
      - name: Rule pack render freshness
        run: uv run --directory core python ../tools/rules/render_pack.py --check

  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Core tests
        run: uv run --directory core pytest -q
      - name: Training dataset freshness
        run: uv run --directory core python ../tools/training/build_chat_dataset.py --check
      - name: SFT split freshness
        run: uv run --directory core python ../tools/training/build_sft_split.py --check
      - name: Teacher-augmented SFT split freshness
        run: uv run --directory core python ../tools/training/build_sft_teacher.py --check
      - name: Repair corpus freshness (offline)
        run: uv run --directory core python ../tools/training/build_repair_dataset.py --check
      - name: Repair SFT split freshness
        run: uv run --directory core python ../tools/training/build_repair_split.py --check
      - name: Spec codegen freshness
        run: python tools/codegen/generate_spec.py --check
      - name: Interfaces codegen freshness
        run: python tools/codegen/generate_interfaces.py --check
      - name: Flow book freshness
        run: uv run --directory core python ../tools/flow/render_book.py --check
      - name: Rule pack freshness
        run: uv run --directory core python ../tools/rules/render_pack.py --check
      - name: RAG corpus freshness
        run: uv run --directory core python ../tools/rag/build_corpus.py --check
      - name: Fleet config freshness
        run: uv run --directory core python ../tools/serving/fleet.py --check
      - name: Eval case set freshness
        run: uv run --directory core python ../tools/eval/build_cases.py --check
      - name: Eval gates
        run: uv run --directory core python ../tools/eval/run_eval.py
      - name: CAD case set (offline, no engine)
        run: uv run --directory core python ../tools/cad/verify.py --check
      - name: Generated foundation fixtures are fresh (offline, no engine)
        run: uv run --directory core python ../tools/cad/foundation_probe.py --check
      - name: Generated floor fixtures are fresh (offline, no engine)
        run: uv run --directory core python ../tools/cad/floor_probe.py --check
      - name: The committed BOQ is fresh and its arithmetic adds up
        run: uv run --directory core python ../tools/boq/build_boq.py --check
      - name: The committed price-service artefacts are fresh
        run: uv run --directory core python ../tools/pricing/price_service.py --check
      - name: The committed compliance reports are fresh
        run: uv run --directory core python ../tools/compliance/render_reports.py --check
      - name: The committed walking-skeleton report is present and passed
        run: uv run --directory core python ../tools/walking_skeleton/run.py --check
      - name: Generated rebar fixtures are fresh (offline, no engine)
        run: uv run --directory core python ../tools/cad/rebar_probe.py --check
      - name: The committed mesh is fresh and agrees with the design (offline, no engine)
        run: uv run --directory core python ../tools/cad/mesh_probe.py --check
      - name: The committed federation artefacts agree with the design (offline, no engine)
        run: uv run --directory core python ../tools/cad/federation_probe.py --check
      - name: The generated common-services fixtures are fresh (offline, no engine)
        run: uv run --directory core python ../tools/cad/commons_probe.py --check
      - name: The committed drawing set is fresh (offline, no engine)
        run: uv run --directory core python ../tools/cad/drawing_set_probe.py --check
      - name: The committed MEP design and its schedules are fresh (offline, no engine)
        run: uv run --directory core python ../tools/mep/build_mep.py --check
      - name: The spec engine survives the fuzzer (plan section 9)
        run: uv run --directory core python ../tools/ci/spec_fuzz_guard.py

  # Real FreeCAD, weekly and on demand. Not on every push: this is a private repository and a
  # full engine install per push would spend the monthly Actions minutes for no extra signal.
  # The Windows dev machine runs the same probe at every CAD change and records the numbers in
  # docs/spec/cad-verify-v0.md. Ubuntu 24.04 has no freecad deb (snap only), so the engine comes
  # from conda-forge into a job-local prefix.
  cad-execution:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install FreeCAD (conda-forge, headless)
        run: |
          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj bin/micromamba
          export MAMBA_ROOT_PREFIX="$RUNNER_TEMP/mamba"
          ./bin/micromamba create -y -p "$RUNNER_TEMP/cad" -c conda-forge freecad=1.1.3
          CMD="$RUNNER_TEMP/cad/bin/freecadcmd"
          if [ ! -x "$CMD" ]; then CMD="$RUNNER_TEMP/cad/bin/FreeCADCmd"; fi
          "$CMD" --version
          echo "ARCHRES_FREECADCMD=$CMD" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Sync workspace
        run: uv sync --all-packages
      - name: Execute the committed CAD cases
        run: |
          uv run --directory core python ../tools/cad/verify.py --run \
            --workdir "$GITHUB_WORKSPACE/data/tmp/cad-ci" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/report.json" \
            --markdown "$GITHUB_WORKSPACE/data/tmp/cad-ci/report.md"
      - name: Replay the repair corpus against the engine
        run: uv run --directory core python ../tools/training/build_repair_dataset.py --check --engine "$ARCHRES_FREECADCMD"
      - name: Probe the CAD worker pool (two workers, a crash, a recovery)
        run: |
          uv run --directory core python ../tools/cad/pool_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --workdir "$RUNNER_TEMP/pool-probe" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/pool-probe.json"
      - name: Probe the foundation generator (spec -> design -> macro -> measured geometry)
        run: |
          uv run --directory core python ../tools/cad/foundation_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/foundation-probe.json"
      - name: Probe the floor generator (spec -> design -> macro -> measured geometry)
        run: |
          uv run --directory core python ../tools/cad/floor_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/floor-probe.json"
      - name: Probe the rebar generator (the schedule and the engine must agree)
        run: |
          uv run --directory core python ../tools/cad/rebar_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/rebar-probe.json"
      - name: Probe the drawing sheet (a sheet a human can read, byte-stable)
        run: |
          uv run --directory core python ../tools/cad/sheet_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/sheet-probe.json"
      - name: Probe the mesh export (what the workspace draws)
        run: |
          uv run --directory core python ../tools/cad/mesh_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/mesh-probe.json"
      - name: Probe the federation (the per-phase files and the linking master)
        run: |
          uv run --directory core python ../tools/cad/federation_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/federation-probe.json"
      - name: The equivalence gate (an incremental rebuild must equal a full rebuild)
        run: |
          uv run --directory core python ../tools/cad/equivalence_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/equivalence-probe.json"
      - name: "Probe the common services (the scale-out - two storeys, stair, lift, runs)"
        run: |
          uv run --directory core python ../tools/cad/commons_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/commons-probe.json"
      - name: Probe the drawing set (the sheets an engineer sends)
        run: |
          uv run --directory core python ../tools/cad/drawing_set_probe.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/drawing-set-probe.json"
      - name: Run the walking skeleton (one house, end to end, every stage checked)
        run: |
          uv run --directory core python ../tools/walking_skeleton/run.py \
            --engine "$ARCHRES_FREECADCMD" \
            --json "$GITHUB_WORKSPACE/data/tmp/cad-ci/walking-skeleton.json"
      - name: Upload the execution report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-execution-report
          path: data/tmp/cad-ci
          if-no-files-found: warn

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir app typecheck
