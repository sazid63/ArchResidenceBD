name: Release

# Builds the Windows installers when a version tag is pushed (git tag v2.6.0 && git push origin v2.6.0).
# The tag must match "version" in package.json. The release is created as a draft for the owner to review and publish.
# Installers are not code-signed here: signing needs the certificate (see src-tauri/sign-release.ps1).

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer (NSIS and MSI)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Types and unit tests
        run: |
          npx tsc --noEmit
          npm test

      - name: Web build, size budget and offline checks
        run: |
          npm run build
          npm run check:bundle
          npm run test:offline

      - name: Build the installers
        run: npx tauri build --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
