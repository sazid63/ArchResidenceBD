      pages: 2
    notes: "Pinned so far: ONLY the 2-page gazette notice S.R.O. No. 282-Law/2022 (Bangladesh Gazette extra issue, 23 Aug 2022, Ministry of Housing and Public Works, Planning Branch-3), supplied by the owner 2026-11-09, a scan with no text layer. It approves the Master Plan (Detailed Area Plan for Dhaka, 2016-2035 draft title; the approved plan is the DAP 2022-2035), repeals the 22 June 2010 DAP (S.R.O. 232-Law/2010), and says the schedule, 'Master Plan, Volume 1 and Volume 2', is printed separately. Those two volumes hold the rules and land-use zones and are NOT yet held. Source URL of the notice file was not given (file name fa2e80425b544fd99e78c9632a8900fc.pdf, PDF dated 23 Aug 2022). Held copy: C:/1_SAJID/ArchResidenceBD/_backup/sources/rajuk-dap-2022-sro-282-notice.pdf (not in git). rajuk.gov.bd publishes the map-index pages (A to I). The 2016-2035 DRAFT PDF linked from the home page (sha256 87fabf69f16c3af0b2bb...) is not the approved plan and was not used. Nothing from DAP enters a rule pack until Volume 1 and 2 are pinned (see spec/rules/bnbc-2020.yaml gaps). A 2025 TOD guideline under the DAP is entry rajuk-dap-tod-guideline-2025. Also held (owner download 2026-11-09): one official map sheet, 'Integrated Detailed Area Plan (2022-2035) Map on RS Mauza', sheet I13-3, scale 1:1980, citing SRO 282-Law/2022 (RAJUK, consultants Sheltech, The Decode, DDC; 6230571 bytes, 1 page, sha256 0fe47f133b9d467017a3be728ef4a3589cdbd34e83e70abf8ce88862c54d7851), a land-use map for part of Dhaka City Corporation wards near Joar Sahara (C:/1_SAJID/ArchResidenceBD/_backup/sources/rajuk-dap-2022-map-sheet-I13-3.pdf, not in git). It shows land-use zones per plot but the legend does not give each zone's permitted uses; those are in Volume 1 and 2. One sheet of a large sheet index, so it covers a small part of Dhaka only."

