# Source Registry v0 (W0.10) - curated trusted sources per data type (plan §5.10).
# The AI fetches through this registry instead of blind searching; every fetched value
# carries provenance. Validated against spec/schemas/source-registry.schema.json in
# core/tests/test_source_registry.py. Doc: docs/spec/source-registry-v0.md.
#
# Verification state 2026-10-18: ffwc-flood and bwdb-schedule-of-rates were fetched and
# confirmed live from the build machine; bbs / pwd / hbri / srdi / rajuk domains did not
# resolve from this network and stay `candidate` with a note - never silently assumed.

schemaVersion: "0.1.0"
registryId: "sources-v0"
updated: "2026-10-18"

fetchPolicy:
  - "Consent: fetching requires the user's explicit approval per source (plan §3, §5.10) - nothing fetches at startup or in the background."
  - "Cache-first: reuse a fresh cache copy (per-source cacheTtlDays); a fresh copy is never re-fetched."
  - "Provenance: every fetched value carries sourceId + url + retrievedAt + sha256 of the fetched artifact (plan §2.5); the cache manifest is the evidence."
  - "Candidate-only: fetched numbers enter rate cards as candidate lines until a human marks the card active (plan §9 quality law)."
  - "No silent gaps: an unavailable source surfaces as 'not fetched - reason', never as zero or a blank."

