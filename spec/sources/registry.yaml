      en: "Imarat Nirman Bidhimala 2008 (Bangladesh Gazette, extra issue, 29 May 2008)"
    kind: pdf-document
    language: [bn]
    licence: "Government gazette publication; numbers are used as facts with per-rule citations (ADR-0003); no text bundled."
    fetch:
      method: GET
      parser: manual-review
      recipe: "Hold the gazette PDF (any mirror), hash it first (expect the pinned sha256), page-map per tools/rules/gazette/README.md, extract per ADR-0003. Record the download URL in the fetch manifest - it was not recorded at the 2026-10-17 retrieval (process gap)."
    cadence: static
    lastVerified: "2026-10-17"
    artifact:
      fileName: "rajuk-bidhimala-2008-gazette.pdf"
      sizeBytes: 1946482
      sha256: "3318b3f434a9bf248c798c1982e800360ddf22ae7216966efeacf47d9b860d5e"
      pages: 199
    notes: "Backs rule pack rajuk@2008.1 (spec/rules/rajuk-2008.yaml). A second independent download (mirror) was byte-identical."

