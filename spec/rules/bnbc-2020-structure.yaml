# ---------------------------------------------------------------- dead loads
unitWeights:                       # Table 6.2.1, kN/m3
  cite: dead-materials
  brick: 18.9
  cementLooseNote: "Cement 14.7; sand (dry) 15.7; granite/basalt 26.4; limestone 24.5; steel 77.0"
  concreteStoneUnreinforced: 22.8   # footnote *: brick aggregate 20.4; for reinforced concrete add 0.63 kN/m3 per 1 % of main reinforcement by volume
  concreteBrickUnreinforced: 20.4
  reinforcementAddKnM3PerPercent: 0.63
  brickAggregateFraction: 0.9       # Table 6.2.2 footnote: for brick aggregate 90 % of the listed values may be used

constructionWeights:               # Table 6.2.2, kN/m2 unless stated
  cite: dead-constr
  concreteSlabStone: {per100mmKnM2: 2.360, cite: dead-constr, note: "solid slab 100 mm 2.360; 150 mm 3.540 (= 23.6 kN/m3, stone aggregate)"}
  brickMasonryBurntClayPer100mm: 1.910     # excluding plaster
  brickMasonrySandLimePer100mm: 1.980
  cementPlasterPer10mm: 0.230
  claytiling13mm: 0.268
  terrazzo16mm: 0.431
  bituminousFeltGravel5ply: 0.431          # roof
  ceilingCementPlaster13mm: 0.287

# ---------------------------------------------------------------- live-load reduction (Sec 2.3.13)
liveLoadReduction:
  cite: live-reduction
  appliesWhenKllAtAtLeastM2: 37.16
  expr: "L = L0 (0.25 + 4.57 / sqrt(KLL AT))"
  minFraction: {oneFloor: 0.50, twoOrMoreFloors: 0.40}
  noReductionAboveKnM2: 4.80
  roofNote: "Roof uniform live loads are not reduced under Sec 2.3.13 (Sec 2.3.14 has its own rule, not transcribed)."
  kll: {interiorColumns: 4, exteriorColumnsNoCantilever: 4, edgeColumnsCantilever: 3, cornerColumnsCantilever: 2, edgeBeamsNoCantilever: 2, interiorBeams: 2, other: 1}
  otherNote: "Table 6.2.7 'all other members' (one-way and two-way slabs, members without continuous shear transfer) = 1: read from the page text (pdf 543); the cell sits across the page break."

# ---------------------------------------------------------------- concrete and reinforcement
concrete:
  ecNormal: {expr: "4700 sqrt(fc')", cite: ec}
  ecBrickAggregate: {expr: "3750 sqrt(fc')", cite: ec}
  modulusOfRupture: {expr: "fr = 0.62 sqrt(fc')", cite: deflection}
  effectiveInertia: {expr: "Ie = (Mcr/Ma)^3 Ig + (1 - (Mcr/Ma)^3) Icr <= Ig", cite: deflection}
  continuousIe: "Prismatic members: Ie at mid-span for simple and continuous spans (Sec 6.2.5.2.4)."
  longTerm: {expr: "lambda = xi / (1 + 50 rho')", xi: {y5orMore: 2.0, m12: 1.4, m6: 1.2, m3: 1.0}, cite: deflection}
strength:
  phiFlexureTensionControlled: 0.90
  phiShear: 0.75
  cite: phi
shear:
  vc: {expr: "Vc = 0.17 sqrt(fc') bw d", cite: shear}
  minAvOverS: {expr: "Av,min/s = 0.062 sqrt(fc') bw / fyt, not less than 0.35 bw / fyt", cite: shear}
minFlexure:
  expr: "As,min = max(0.25 sqrt(fc') / fy, 1.4 / fy) bw d"
  cite: min-flexure
  slabsSameAsShrinkage: true
shrinkage:                         # Sec 8.1.11.2, ratio of steel to gross concrete area
  cite: shrinkage
  fy275or350: 0.0020
  fy420: 0.0018
  floor: 0.0014
cover:                              # Sec 8.1.7.2, mm, concrete not exposed to weather or ground
  cite: cover
  slabsWalls: {bar36andSmaller: 20, bar40to57: 40}
  exposedToWeatherOrEarth: {bar19to57: 50, bar16andSmaller: 40}
  againstEarth: 75
  beamsColumnsNote: "Beams and columns: primary reinforcement, ties and stirrups; the row values sit in a text block that the page text scrambles. 40 mm is used (mild, not exposed) and flagged as an assumption in src/structure/materials.ts."

# ---------------------------------------------------------------- deflection and minimum thickness
minThickness:
  table_6_6_1:                      # as a fraction of the span l: simply supported / one end continuous / both ends continuous / cantilever
    cite: deflection
    solidOneWaySlab: {divisors: [20, 24, 28, 10]}
    beamOrRibbedSlab: {divisors: [16, 18.5, 21, 8]}
    note: "Values for normal-weight concrete and Grade 420; for other fy multiply by (0.4 + fy/700)."
  twoWay:
    cite: deflection
    eq_6_6_5: {alphaFmBetween: [0.2, 2.0], expr: "h = ln (0.8 + fy/1400) / (36 + 5 beta (alphaFm - 0.2))", minMm: 125}
    eq_6_6_6: {alphaFmAbove: 2.0, expr: "h = ln (0.8 + fy/1400) / (36 + 9 beta)", minMm: 90}
    discontinuousEdge: "An edge beam with alpha_f >= 0.80 shall be provided at discontinuous edges, or h from Eq 6.6.5 / 6.6.6 is increased by at least 10 % in the panel (Sec 6.2.5.3.3 d)."
    ln: "clear span in the long direction, face to face of beams; beta = clear long / clear short"
deflectionLimits:                   # Table 6.6.2, span l
  cite: deflection
  flatRoofNotDamaged: {basis: "immediate live-load deflection", divisor: 180}
  floorNotDamaged: {basis: "immediate live-load deflection", divisor: 360}
  supportingDamageable: {basis: "part after attachment of nonstructural elements: long-term deflection of sustained loads plus immediate deflection of added live load", divisor: 480}
  notDamageable: {basis: "same part", divisor: 240}

# ---------------------------------------------------------------- approximate moments, continuous beams and one-way slabs (Sec 6.1.4.3)
approxCoefficients:
  cite: approx-coeff
  conditions: ["two or more spans", "adjacent spans differ by not more than 20 %", "uniform loads", "unfactored L <= 3 D", "prismatic members"]
  momentDivisors:                   # wu ln^2 / divisor; ln = clear span (negative moments: average of adjacent clear spans)
    positiveEndSpanDiscontinuousEndUnrestrained: 11
    positiveEndSpanDiscontinuousEndIntegral: 14
    positiveInterior: 16
    negativeFirstInteriorSupportTwoSpans: 9
    negativeFirstInteriorSupportMoreThanTwo: 10
    negativeOtherInteriorFaces: 11
    negativeAllSupportsSlabSpanUpTo3048mm: 12
    negativeExteriorFaceSpandrelBeam: 24
    negativeExteriorFaceColumn: 16
  shearFactors: {firstInteriorSupportEndMember: 1.15, otherSupports: 1.0}

# ---------------------------------------------------------------- two-way edge-supported slabs, coefficient method (Sec 6.5.8.3)
# Panels: rectangular, longer / shorter centre-to-centre span <= 2, edges on walls or beams at least 3 x slab thickness deep (Sec 6.5.8.2).
# la = shorter span, lb = longer span, m = la / lb. Ma = Ca w la^2, Mb = Cb w lb^2. w factored: negative with total w, dead positive with dead w, live positive with live w.
# Cases 1..9 by continuous edges. The icons in the table show continuity as a shaded edge; read from the page images:
#   long edges = the two edges of length lb (they bound the la span), short edges = the two edges of length la.
#   1 none | 2 all four | 3 both short edges | 4 one short + one long (adjacent) | 5 both long edges
#   6 one long edge | 7 one short edge | 8 both short + one long | 9 both long + one short
twoWayCases:
  - {case: 1, shortContinuous: 0, longContinuous: 0}
  - {case: 2, shortContinuous: 2, longContinuous: 2}
  - {case: 3, shortContinuous: 2, longContinuous: 0}
  - {case: 4, shortContinuous: 1, longContinuous: 1}
  - {case: 5, shortContinuous: 0, longContinuous: 2}
  - {case: 6, shortContinuous: 0, longContinuous: 1}
  - {case: 7, shortContinuous: 1, longContinuous: 0}
  - {case: 8, shortContinuous: 2, longContinuous: 1}
  - {case: 9, shortContinuous: 1, longContinuous: 2}
