# BNBC 2020 structural-design values used by src/structure (ticket M4-1 transcription pass, 2026-11-09).
# Companion to spec/rules/bnbc-2020.yaml (same source, same citation scheme); kept in its own file so the
# owner-reviewed pack is untouched. status: candidate - owner has not reviewed these tables.
# Source: Bangladesh National Building Code 2020, S.R.O. No. 55-Law/2020, gazette extra issue 11 Feb 2021
# (registry id bnbc-2020-gazette). Part 6 = Structural Design: Ch 2 loads, Ch 6 (printed "6.x" tables) concrete design.
# Every number was read from a rendered page image. The text layer was then used to cross-check the coefficient
# tables: all 6 table blocks match the page text digit for digit and in cell order, except the printed typo noted in gaps.
# src/structure/transcription.test.ts checks internal consistency (w_a + w_b = 1, monotone rows, symmetric cases).
# pdfPage = page index in the PDF; gazette page = printed number in the page header.

packVersion: "0.1.0"
id: "bnbc-structure@2020.1"
authority: "bnbc"
regime: "2020"
status: "candidate"

citations:
  dead-materials: {gazettePage: "3110-3111", pdfPage: "529-530", note: "Part 6 Sec 2.2.4; Table 6.2.1 Unit Weight of Basic Materials"}
  dead-constr:    {gazettePage: "3111-3112", pdfPage: "530-531", note: "Part 6 Table 6.2.2 Weight of Construction Materials"}
