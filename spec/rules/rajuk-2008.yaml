footnotes:
  - id: f1
    mark: "[১]"
    appliesTo: [A1-A4, A5]
    cite: far-3ka-fn
    text:
      bn: "অপরিকল্পিত আবাসিক এলাকায় ট্রাফিক, পার্কিং এবং অন্যান্য চাহিদা পূরণ সাপেক্ষে নিম্নোক্ত ব্যবহার চালানো যাবে: (ক) ডরমিটরি ও হোস্টেল; (খ) শিশু নিবাস, এতিম খানা এবং বৃদ্ধ নিবাস; (গ) সর্বাধিক ২০ কক্ষবিশিষ্ট হোটেল বা লজ; (ঘ) অনূর্ধ্ব ১০০ বর্গমিটারের রেস্টুরেন্ট; (ঙ) অনূর্ধ্ব ২০০ বর্গমিটারের ধর্মীয় উপাসনার স্থান; (চ) আবাসিক ভবনের নীচতলায় পেশাজীবীদের অফিস, স্টুডিও বা চেম্বার — যা ১০০ বর্গমিটারের বেশি নয় এবং যেখানে মোট জনবল অনূর্ধ্ব ১৫ জন; (ছ) কেবল কর্নার প্লটের জন্য অনূর্ধ্ব ২৫ বর্গমিটারের সেলুন, বিউটি পার্লার, ঔষধের দোকান, মুদি দোকান, দর্জির দোকান।"
      en: "In unplanned residential areas, subject to traffic, parking and other requirements being met, the following uses may be operated: (ka) dormitory and hostel; (kha) children's home, orphanage and home for the elderly; (ga) hotel or lodge with at most 20 rooms; (gha) restaurant up to 100 sqm; (nga) religious place of worship up to 200 sqm; (cha) on the ground floor of a residential building, professional offices, studios or chambers not exceeding 100 sqm with a total staff of at most 15; (chha) corner plots only: a saloon, beauty parlour, medicine shop, grocery shop or tailor shop up to 25 sqm."
  - id: f2
    mark: "[২]"
    appliesTo: [A5]
    cite: far-3ka-fn
    text:
      bn: "A5 (আবাসিক হোটেল) ইমারতের ক্ষেত্রে ২০ কাঠার ঊর্ধ্ব জমি বা ১৮ মিটার বা তদূর্ধ্ব প্রশস্ত রাস্তার পাশে, যে কোন পরিমাপের জমির বেলায়, নীচতলায় আবশ্যক সেটব্যাক স্পেস ব্যতীত সংলগ্ন রাস্তার উপরিতল হইতে সর্বোচ্চ ১২ মিটার উচ্চতার (প্যারাপেটসহ) পোর্টিয়াম নির্মাণ করা যাবে।"
      en: "For A5 (residential hotel) buildings: on plots above 20 katha or beside a road 18 m or wider, a portico of at most 12 m height (including parapet) may be built on the lowest floor for any plot size, measured from the adjoining road top level, outside the mandatory setback space."
  - id: fnr
    mark: "*"
    cite: far-3ka-fn
    text:
      bn: "NR (Non restricted) — FAR-এর বাধ্যবাধকতা নাই।"
      en: "NR (Non restricted) - there is no FAR cap."
  - id: f3
    mark: "[৩]"
    appliesTo: [B2]
    cite: far-3kha-fn
    text:
      bn: "B2 শ্রেণীর ইমারতের নীচতলার উন্মুক্ত স্থান FAR-মুক্ত হিসাবে বিবেচিত হবে। এই উন্মুক্ত স্থানের সর্বোচ্চ ২০% উন্মুক্ত ব্যবহারের সহায়ক কক্ষ হিসাবে নির্মাণ করা যাবে এবং এই অংশও FAR-মুক্ত হবে।"
      en: "The ground-floor open space of a B2 building is counted as FAR-free. Up to 20% of this open space may be built as auxiliary rooms serving the open space, and this portion is also FAR-free."
  - id: f4
    mark: "[৪]"
    appliesTo: [B2]
    cite: far-3kha-fn
    text:
      bn: "B2 শ্রেণীর ইমারতের নীচতলার উন্মুক্ত স্থান FAR-মুক্ত হিসাবে বিবেচিত হবে। এই উন্মুক্ত স্থানের সর্বোচ্চ ৪০% উন্মুক্ত ব্যবহারের সহায়ক কক্ষ হিসাবে নির্মাণ করা যাবে এবং এই অংশও FAR-মুক্ত হবে।"
      en: "The ground-floor open space of a B2 building is counted as FAR-free. Up to 40% of this open space may be built as auxiliary rooms serving the open space, and this portion is also FAR-free."
  - id: f-prohib-b
    mark: "**"
    appliesTo: [B1, B2]
    cite: far-3kha-fn
    text:
      bn: "৩৩৫ বর্গ মিটার বা ৫ (পাঁচ) কাঠা জমি পর্যন্ত B-1 ও B-2 শ্রেণীর ব্যবহার অনুমোদন করা হবে না।"
      en: "B-1 and B-2 uses are not approved on plots up to 335 sq m or 5 (five) katha."
  - id: f5
    mark: "[৫]"
    appliesTo: [C1-C4, D1-D2]
    cite: far-3ga-fn
    text:
      bn: "C ও D উভয় প্রকার ইমারতের ক্ষেত্রে ২০ কাঠার ঊর্ধ্ব জমি বা ১৮ মিটার বা তদূর্ধ্ব প্রশস্ত রাস্তার পাশে, যে কোন পরিমাপের জমির বেলায়, আবশ্যক সেটব্যাক স্পেস ব্যতীত সংলগ্ন রাস্তার উপরিতল হইতে সর্বোচ্চ ১২ মিটার উচ্চতার (প্যারাপেটসহ) পোর্টিয়াম নির্মাণ করা যাবে।"
      en: "For both C and D buildings: on plots above 20 katha or beside a road 18 m or wider, a portico of at most 12 m height (including parapet) may be built for any plot size, measured from the adjoining road top level, outside the mandatory setback space."
  - id: f-prohib-cd
    mark: "**"
    appliesTo: [C1-C4, D1-D2]
    cite: far-3ga-fn
    text:
      bn: "৩৩৫ বর্গ মিটার বা ৫ (পাঁচ) কাঠা জমি পর্যন্ত C ও D শ্রেণীর ব্যবহার অনুমোদন করা হবে না।"
      en: "C and D uses are not approved on plots up to 335 sq m or 5 (five) katha."
  - id: f6
    mark: "[৬]"
    appliesTo: [E1-E6]
    cite: far-3gha-fn
    text:
      bn: "২৪ মিটার বা তদূর্ধ্ব প্রশস্ত রাস্তার পাশে যে কোন পরিমাপের জমির বেলায়, আবশ্যক সেটব্যাক স্পেস ব্যতীত সংলগ্ন রাস্তার উপরিতল হইতে সর্বোচ্চ ১২ মিটার উচ্চতার (প্যারাপেটসহ) পোর্টিয়াম নির্মাণ করা যাবে।"
      en: "On the side of a road 24 m or wider, a portico of at most 12 m height (including parapet) may be built on any plot size, measured from the adjoining road top level, excluding the mandatory setback space."
  - id: f7
    mark: "[৭]"
    appliesTo: [F1, F2-F5]
    cite: far-3nga-fn
    text:
      bn: "প্রযোজ্য আবশ্যক সেটব্যাক স্পেস ব্যতীত সংলগ্ন রাস্তার উপরিতল হইতে সর্বোচ্চ ১২ মিটার উচ্চতার (প্যারাপেটসহ) পোর্টিয়াম নির্মাণ করা যাবে।"
      en: "Excluding the applicable mandatory setback space, a portico of at most 12 m height (including parapet) may be built, measured from the adjoining road top level."

