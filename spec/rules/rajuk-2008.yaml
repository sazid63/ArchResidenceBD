  drivewayWidths:
    - {angleDeg: 0, singleLoadedM: 3.50, doubleLoadedM: 4.00, twoWayM: 4.25}
    - {angleDeg: 45, singleLoadedM: 4.00, doubleLoadedM: 4.00, twoWayM: 4.25}
    - {angleDeg: 90, singleLoadedM: 4.25, doubleLoadedM: 4.25, twoWayM: 4.25}
  rules:
    - id: s56-4-5-entry-exit
      clause: "§56(4)-(5)"
      cite: s56-4-5
      title:
        bn: "বাস/ট্রাক পার্কিং — প্রবেশ ও প্রস্থান"
        en: "Bus/truck parking - entry and exit"
      summary:
        bn: "§৫৬(৪): বাস/ট্রাক পার্কিংয়ে পৃথক প্রবেশ ও প্রস্থান প্রতিটি ন্যূনতম ৪.২৫ মিটার, অথবা সম্মিলিত প্রবেশ-প্রস্থান ৬.০০ মিটার; (৫) পার্কিং সূচি-৪ অনুসারে।"
        en: "Section 56(4): bus/truck parking needs separate entry and exit of at least 4.25 m each, or a combined one of 6.0 m; (5) parking is per Schedule 4."
    - id: s56-6-on-street
      clause: "§56(6)"
      cite: s56-6
      title:
        bn: "রাস্তায় কোণাকুণি পার্কিং"
        en: "On-street angled parking"
      summary:
        bn: "রাস্তায় কোণাকুণি পার্কিং সর্বোচ্চ ৪টি কার, কোণ সর্বোচ্চ ৪৫ ডিগ্রি; বাস স্টপ হইতে ১৫ মিটার ও ক্রসিং হইতে ২৫ মিটারের মধ্যে নহে; জাতীয় মহাসড়কে কখনও নহে।"
        en: "On-street angled parking: at most 4 cars, angle at most 45 degrees, not within 15 m of a bus stop or 25 m of a crossing, never on a national highway."
    - id: s56-7-15-ramps
      clause: "§56(7)-(15)"
      cite: s56-7-15
      title:
        bn: "ফুটপাত, র‍্যাম্প, ক্লিয়ারেন্স ও প্রবেশপথ"
        en: "Footpath, ramps, clearance and access"
      summary:
        bn: "§৫৬(৭): ফুটপাত কাটা কেবল কর্তৃপক্ষের অনুমতিতে; (৮) র‍্যাম্পের ঢাল সর্বোচ্চ ১:৮, র‍্যাম্পের পূর্বে ন্যূনতম ৪.২৫ মিটার সোজা অংশ, ০.৭৫ মিটার পর্যন্ত পার্থক্যে র‍্যাম্প লাগিবে না; (৯) র‍্যাম্প সেটব্যাকের ভিতরে গণ্য; (১০) একমুখী র‍্যাম্প ন্যূনতম ৩.০০ মিটার, দুইমুখী ৪.২৫ মিটার (বিশেষ ক্ষেত্রে ৬.০০ মিটার); (১১) আবাসিকে ১০০ ও অন্যথায় ৫০ কার-এর ঊর্ধ্বে পৃথক মার্শালিং লেন; (১২) ন্যূনতম ক্লিয়ারেন্স ২.২৫ মিটার; (১৩) সম্মুখপ্রস্থ ১০ মিটার পর্যন্ত এক প্রবেশ-প্রস্থান, তার ঊর্ধ্বে দুইটি অনুমোদনযোগ্য; (১৪) কার লিফট বিকল্প হিসাবে গ্রহণযোগ্য; (১৫) লুপ-আউট লেন প্রয়োজন হইতে পারে।"
        en: "Section 56(7): footpath cutting only with authority permission; (8) ramp slope at most 1:8, with at least a 4.25 m straight run before the ramp; no ramp needed for a step up to 0.75 m; (9) ramps count within the setback; (10) one-way ramp at least 3.0 m, two-way 4.25 m (6.0 m in special cases); (11) for 100+ cars (residential) or 50+ (others) a separate marshalling lane; (12) at least 2.25 m clearance; (13) frontage up to 10 m: a single entry+exit; above 10 m: two may be allowed; (14) a car lift is an acceptable alternative; (15) a loop-out lane may be required."

provisions:
  - id: far-tables
    clause: "§51(1)"
    cite: s51-1
    title:
      bn: "FAR ও ভূমি আচ্ছাদন সারণি (সারণি-৩(ক)–(চ))"
      en: "FAR and ground coverage tables, Tables 3(ka)-(cha)"
    summary:
      bn: "প্রতিটি ইমারত-শ্রেণীর FAR ও সর্বোচ্চ ভূমি আচ্ছাদন সারণি-৩(ক)–(চ)-এর প্রযোজ্য সারি অনুযায়ী নির্ধারিত হইবে; জমির আকার ও সংলগ্ন রাস্তার প্রস্থ দিয়া সারি নির্বাচন করিতে হইবে এবং সেই সারির পাদটীকাসমূহ প্রযোজ্য। সারণিতে 'NR' মুদ্রিত হইলে FAR-এর বাধ্যবাধকতা নাই।"
      en: "FAR and maximum ground coverage for each building class follow the applicable row of Tables 3(ka)-(cha); the row is selected by plot size and adjoining road width, and that row's footnotes apply. Where 'NR' is printed there is no FAR cap."
  - id: setback-schedule
    clause: "§46(1)-(2)"
    cite: setbacks
    title:
      bn: "সীমানা হইতে আবশ্যক সেটব্যাক"
      en: "Mandatory setbacks from boundaries"
    summary:
      bn: "৩৩ মিটার উচ্চতা বা ১০ তলা পর্যন্ত ইমারতের জন্য জমির আকারভেদে: সামনে সর্বনিম্ন ১.৫০ মিটার; পিছনে ১.০০ হইতে ২.০০ মিটার; পাশে ০.৮০ হইতে ১.২৫ মিটার (২০ কাঠার ঊর্ধ্ব জমিতে পাশে ১.৫০ মিটার)। ৩৩ মিটার বা ১০ তলার ঊর্ধ্বে সামনে ১.৫০ মিটার, পিছনে ৩.০০ মিটার ও পাশে ৩.০০ মিটার প্রযোজ্য।"
      en: "For buildings up to 33 m or 10 storeys, by plot size: front at least 1.50 m; rear 1.00 to 2.00 m; sides 0.80 to 1.25 m (1.50 m at the sides of plots above 20 katha). Above 33 m or 10 storeys: front 1.50 m, rear 3.00 m and sides 3.00 m."
  - id: s46-3-4
    clause: "§46(3)-(4)"
    cite: s46-3-4
    title:
      bn: "রাস্তা ও প্লট-সীমানা হইতে ন্যূনতম দূরত্ব"
      en: "Minimum distance from road and plot boundary"
    summary:
      bn: "কোনো ইমারত রাস্তার কেন্দ্ররেখা হইতে ৪.৫০ মিটারের কম এবং প্লট-সীমানা হইতে ১.৫০ মিটারের কম দূরত্বে নির্মিত হইতে পারিবে না (ভবিষ্যৎ রাস্তা সম্প্রসারণের জন্য প্রয়োজনীয় জমি বাদে)। ড্যাপ নির্দিষ্ট রাস্তার জন্য ইহার চেয়ে বেশি সম্মুখ সেটব্যাক বাধ্যতামূলক করিতে পারিবে।"
      en: "No building may be built closer than 4.50 m from the road centreline or 1.50 m from the plot boundary (excluding land required for future road widening). The DAP may impose a greater front setback for specific roads."
  - id: s46-5-items-1
    clause: "§46(5)(ক)-(খ)"
    cite: s46-5-1
    title:
      bn: "আবশ্যক উন্মুক্ত স্থান — পাকা অংশ ও আবৃত অংশ"
      en: "Mandatory open space - paved and covered parts"
    summary:
      bn: "(ক) আবশ্যক উন্মুক্ত স্থানের (MOS) সর্বোচ্চ ৫০% পাকা করা যাইবে; পাকা অংশের উপর আচ্ছাদন নির্মাণ করিলে ছাদ ভূমি-সমতল হইতে সর্বোচ্চ ৪.০০ মিটার বা প্লিন্থ হইতে ৩.০০ মিটার (যাহা কম) হইবে এবং সেটব্যাক স্পেসের উপর পড়িতে পারিবে না; উহা কেবল পার্কিং ও নিরাপত্তা বুথ হিসাবে ব্যবহৃত হইবে — একটি শব্দ পাঠযোগ্য নহে, দেখুন candidates C1; বাকি ৫০% জমি মাটি রাখিবার শর্ত মানিতে হইবে; সম্মুখ, পাশ ও পিছনের সেটব্যাক পার্কিংয়ের জন্য ব্যবহারযোগ্য; সীমানা প্রাচীরের উপর সর্বোচ্চ ২.৫০ মিটার উচ্চতার ও ৫ বর্গমিটার ক্ষেত্রফলের নিরাপত্তা কক্ষ থাকিতে পারিবে। (খ) নীচতলার আবৃত অংশ জাল বা বেষ্টনী দ্বারা সম্পূর্ণ ঘেরাও থাকিবে না; বায়ু চলাচল নিশ্চিত থাকিতে হইবে; উহার ছাদ কেবল টেরেস বা টেরেস-গার্ডেন হিসাবে ব্যবহৃত হইবে এবং কোনোভাবেই স্থায়ী বা অস্থায়ী কাঠামো দ্বারা আচ্ছাদিত হইতে পারিবে না।"
      en: "(ka) At most 50% of the mandatory open space may be paved; where the paved part is covered, its roof must stay within 4.00 m of ground level or 3.00 m of the plinth (whichever is less) and must not fall on the setback space; it may serve only as parking and security booth - one word unreadable, see candidates C1; the remaining 50% must be kept as soil; the front, side and rear setbacks may be used for parking; a security room of at most 2.50 m height and 5 sqm may sit on the boundary wall. (kha) The ground-floor covered part must not be fully enclosed by mesh or fence; air circulation must be provided; its roof may be used only as terrace or terrace garden and must never be covered by a permanent or temporary structure."
  - id: s46-5-items-2
    clause: "§46(5)(গ)-(ঘ)"
    cite: s46-5-2
    title:
      bn: "ভূমি-সমতলে উন্মুক্ত ৫০% এবং ব্যালকনি ছাড়"
      en: "Ground-level 50% open space and balcony exemption"
    summary:
      bn: "(গ) MOS-এর ন্যূনতম ৫০% সর্বক্ষেত্রে ভূমি-সমতলে উন্মুক্ত রাখিতে হইবে, যাহাতে বৃষ্টির পানি শোষিত হইতে পারে; এই ৫০% অংশে বেসমেন্ট কোনোভাবেই বর্ধিত করা যাইবে না। (ঘ) দ্বিতীয় বা তদূর্ধ্ব তলার সম্মুখের ব্যালকনি সর্বোচ্চ ভূমি আচ্ছাদনের অতিরিক্ত হিসাবে ছাড় পাইবে এই শর্তে — বেষ্টনীর উচ্চতা সর্বোচ্চ ১,২০০ মি.মি.; ব্যালকনির ক্ষেত্রফল সম্মুখপ্রস্থের ৩০% এবং ১ মিটার প্রস্থের হিসাবে যাহা হয় তাহার বেশি নহে; সেটব্যাকের মধ্যে ব্যালকনি বর্ধিত হইবে না; ছাড়ের পরিমাণ তলাসমূহের মধ্যে বিতরণ করা যাইবে।"
      en: "(ga) At least 50% of the MOS must always remain open at ground level so that rain water can be absorbed; no basement may extend into this 50%. (gha) Front balconies on the second or higher floors are exempted above the maximum ground coverage on these conditions - railing height at most 1,200 mm; balcony area no more than the front width at 30% and 1 m depth gives; the balcony must not extend into the setback; the allowance may be distributed among the floors."
  - id: s46-5-items-3
    clause: "§46(5)(ঙ)"
    cite: s46-5-3
    title:
      bn: "কার্নিশ/ছাজ — সেটব্যাকে সর্বোচ্চ ১ মিটার"
      en: "Cornice - up to 1 m into the setback"
    summary:
      bn: "(ঙ) ইমারতের দালান বা কার্নিশ আবশ্যক সেটব্যাকের মধ্যে সর্বোচ্চ ১.০০ মিটার পর্যন্ত বর্ধিত হইতে পারিবে, কেবল সম্মুখ দিকে; তবে কোনো অবস্থাতেই ভূমি-সমতল হইতে ৮.০০ মিটারের নিচে থাকিতে পারিবে না।"
      en: "(nga) A cornice may project into the mandatory setback by at most 1.00 m, front side only, and must never sit below 8.00 m from ground level."
  - id: s46-5-items-4
    clause: "§46(5)(চ)-(ছ)-(জ)"
    cite: s46-5-4
    title:
      bn: "কার্নিশ-বাহিরে নির্মাণ ও সুরক্ষা-ছাতা"
      en: "Beyond-setback cornice and protection sunshades"
    summary:
      bn: "(চ) সেটব্যাকের বাহিরে ইমারত নির্মাণের ক্ষেত্রে কার্নিশ সর্বোচ্চ ২.০০ মিটার পর্যন্ত বর্ধিত হইতে পারিবে; ইহার অতিরিক্ত অংশ ভূমি আচ্ছাদনে গণ্য হইবে। (ছ) সুরক্ষা-ছাতা সেটব্যাকের মধ্যে সর্বোচ্চ ০.৫০ মিটার (পাশ বা পিছনের সেটব্যাক ১.২৫ মিটারের কম হইলে সর্বোচ্চ ০.৩০ মিটার) পর্যন্ত বর্ধিত হইতে পারিবে; এই ছাতায় কোনো বেষ্টনী, ব্যালকনি বা প্রবেশপথ থাকিতে পারিবে না। (জ) ছাতা সর্বোচ্চ ১.৫০ মিটার পর্যন্ত; ইহার অতিরিক্ত অংশ ভূমি আচ্ছাদনে গণ্য হইবে।"
      en: "(cha) Where a building is built beyond the setback, its cornice may project up to 2.00 m; the excess counts toward ground coverage. (chha) Protection sunshades may extend into the setback by at most 0.50 m (at most 0.30 m where the side or rear setback is under 1.25 m); such a sunshade may carry no enclosure, balcony or access. (ja) Sunshades may project up to 1.50 m; the excess counts toward ground coverage."
  - id: s46-5-items-5
    clause: "§46(5)(ঝ)-(ঞ)-(ট)-(ঠ)"
    cite: s46-5-5
    title:
      bn: "নিষিদ্ধ প্রজেকশনসমূহ"
      en: "Prohibited projections"
    summary:
      bn: "(ঝ) স্টোর, এসি বা টয়লেট-ডাক্ট 'সম্বলিত' কোনো প্রজেকশন সেটব্যাকে নির্মাণ করা যাইবে না। (ঞ) উল্লম্ব ফিন সর্বোচ্চ ১০০ মি.মি. এবং বায়ু চলাচল প্রতিবন্ধক হইবে না। (ট) যান্ত্রিক ভেন্টিলেশন, নিষ্কাশন বা ড্রেনেজ সংলগ্ন প্লটের দিকে নিক্ষিপ্ত হইবে না। (ঠ) তলার ক্ষেত্রফল বৃদ্ধির উদ্দেশ্যে কোনো প্রজেকশন অনুমোদিত নহে।"
      en: "(jha) No projection incorporating a store, AC unit or toilet duct may be built into the setback. (nya) Vertical fins at most 100 mm and must not obstruct air flow. (ta) No mechanical ventilation, exhaust or drainage may be directed toward an adjoining plot. (tha) No projection is allowed for the purpose of increasing floor area."
  - id: s46-6-8
    clause: "§46(6)-(8)"
    cite: s46-6-8
    title:
      bn: "একই প্লটে একাধিক ইমারত ও ডেড-এন্ড রাস্তা"
      en: "Multiple buildings on one plot; dead-end road"
    summary:
      bn: "(৬) একই প্লটে পৃথক একাধিক ইমারত থাকিলে ইমারতসমূহের মধ্যবর্তী ব্যবধান সম্মুখ ও পিছনে ন্যূনতম ৪.০০ মিটার এবং পাশে ন্যূনতম ২.৫০ মিটার হইবে। (৭) সংযুক্ত ইমারতের ক্ষেত্রে সংযোগ-অংশ ক্ষুদ্রতর পাশের দৈর্ঘ্যের ন্যূনতম ৩০% হইবে। (৮) কেবল উক্ত প্লটেই শেষ হইয়াছে এরূপ রাস্তা-সংলগ্ন প্লটে প্রস্তাবিত ইমারত সম্মুখ সীমানা হইতে ন্যূনতম ২.০০ মিটার দূরত্বে নির্মিত হইবে।"
      en: "(6) Where several separate buildings share one plot, the gaps between them must be at least 4.00 m front and rear and 2.50 m at the sides. (7) For connected buildings the joining part must be at least 30% of the shorter side. (8) On a plot where the road ends (dead-end), the proposed building must stand at least 2.00 m from the front boundary."
  - id: s47-basement
    clause: "§47"
    cite: s47
    title:
      bn: "বেসমেন্টের সেটব্যাক"
      en: "Basement setback"
    summary:
      bn: "(১) বেসমেন্ট আবশ্যক উন্মুক্ত স্থানের (MOS) ভিতরে বর্ধিত হইলে তাহা MOS-এর সর্বোচ্চ ৫০% পর্যন্ত সীমাবদ্ধ; অবশিষ্ট ৫০% ভূমি-সমতলে উন্মুক্ত থাকিতে হইবে। (২) প্রতিবেশীর সম্পত্তির নিরাপত্তা নিশ্চিত করিয়া বেসমেন্ট সীমানা দেয়াল পর্যন্ত বর্ধিত করা যাইবে, তবে রাস্তার দিকের ন্যূনতম সেটব্যাক মানিতে হইবে। (৩) বেসমেন্টের উপরিতল সংলগ্ন রাস্তার উপরিতল হইতে সর্বোচ্চ ১.৫০ মিটার উঁচু হইতে পারিবে; র‍্যাম্প সেটব্যাকের মধ্যে অনাচ্ছাদিত রাখিতে পারিবে (§56(8)-(9) দ্রষ্টব্য)।"
      en: "(1) A basement may extend into the mandatory open space (MOS) up to at most 50% of the MOS; the remaining 50% must stay open at ground level. (2) With the neighbour's property safety assured, the basement may extend to the boundary wall while respecting the minimum setback towards the road. (3) The basement top may rise at most 1.50 m above the adjoining road top; ramps may remain uncovered within the setback (see §56(8)-(9))."
  - id: s48-subdivision
    clause: "§48"
    cite: s48
    title:
      bn: "উপবিভাজন ও নিজস্ব রাস্তা"
      en: "Subdivision and private roads"
    summary:
      bn: "প্রতিটি উপ-প্লটের স্বতন্ত্র চলাচলের পথ থাকিতে হইবে এবং প্রতিটি উপ-প্লট স্বতন্ত্রভাবে সেটব্যাকসহ বিধি মানিতে হইবে। একক প্লটের নিজস্ব রাস্তা আবাসিক ব্যবহারে ন্যূনতম ৩.৬৫ মিটার এবং অনাবাসিক ব্যবহারে ন্যূনতম ৬.০০ মিটার; নিজস্ব রাস্তার ক্ষেত্রফল FAR-হিসাবের প্লট-আয়তনে গণ্য হইবে না; রাস্তার প্রস্থ ৩৩ মিটারের বেশি হইলে §51(1) প্রযোজ্য। পরিকল্পিত এলাকায় ন্যূনতম ৫ কাঠা মানিতে হইবে; একাধিক প্লটের নিজস্ব রাস্তা ন্যূনতম ৬.০০ মিটার; বেসরকারি উন্নয়ন এলাকার ইমারতের ক্ষেত্রে ইমারত নির্মাণ বিধিমালা ২০০৪ প্রযোজ্য।"
      en: "Every sub-plot must have its own access path and must independently meet the rules including setbacks. A single plot's private road must be at least 3.65 m for residential use and at least 6.00 m for non-residential use; the road area is not counted in the FAR plot area; where the road is wider than 33 m, §51(1) applies. In planned areas a minimum of 5 katha applies; a private road serving several plots must be at least 6.00 m; buildings in privately developed areas follow the Imarat Nirman Bidhimala 2004."
  - id: s49-amalgamation
    clause: "§49"
    cite: s49
    title:
      bn: "প্লট একত্রীকরণ"
      en: "Plot amalgamation"
    summary:
      bn: "একাধিক প্লট একত্রিত করিয়া নির্মাণ করিলে একত্রিত জমি একটি প্লট হিসাবে গণ্য হইবে; FAR ও ভূমি আচ্ছাদন একত্রিত আকার এবং সংলগ্ন রাস্তার প্রস্থ-ভিত্তিক প্রযোজ্য সারি অনুসারে নির্ধারিত হইবে; দুইভাবে প্রাপ্ত মানের নিম্নতরটি প্রযোজ্য।"
      en: "Where several plots are amalgamated for construction, the combined land counts as one plot; FAR and ground coverage follow the applicable rows for the combined area and the adjoining road width; the lower of the two applies."
  - id: s50-mgc
    clause: "§50"
    cite: s50
    title:
      bn: "সর্বোচ্চ ভূমি আচ্ছাদন ও MOS-এর অখণ্ডতা"
      en: "Maximum ground coverage and MOS indivisibility"
    summary:
      bn: "সর্বোচ্চ ভূমি আচ্ছাদন (MGC) প্লটের আকার, ব্যবহার-শ্রেণী ও রাস্তার প্রস্থ অনুযায়ী সারণি-৩-এর প্রযোজ্য সারি অনুসারে নির্ধারিত; §46(5)-এর ব্যতিক্রম ছাড়া MOS-এর মধ্যে MGC ছাড়াইয়া নির্মাণ করা যাইবে না; MOS অবিভাজ্য এবং বিক্রয়যোগ্য নহে।"
      en: "Maximum ground coverage (MGC) follows the applicable row of Tables 3 by plot size, use class and road width; no building may extend beyond the MGC into the MOS except as allowed by §46(5); the MOS is indivisible and may not be sold."
  - id: s51-2-3-heights
    clause: "§51(2)-(3)"
    cite: s51-2-5
    title:
      bn: "কক্ষের উচ্চতা ও ক্ষেত্রফলের হিসাব"
      en: "Room height and area accounting"
    summary:
      bn: "(২) বাসযোগ্য কক্ষের উচ্চতা সর্বোচ্চ ৪.২৫ মিটার। (৩) ৪.২৫ হইতে ৬.০০ মিটার উচ্চতার কক্ষের ক্ষেত্রফলের সহিত অতিরিক্ত ৫০% যোগ করিতে হইবে; এরূপ অতিরিক্ত মোট ক্ষেত্রফল FAR-এর ১০% অতিক্রম করিতে পারিবে না; মোট ১০% ছাড়াইলে বা কোনো কক্ষ ৬.০০ মিটার ছাড়াইলে অতিরিক্ত ১০০% যোগ হইবে; A5, E, F1, F4, G ও H শ্রেণীর নীচতলা এই বিধির ব্যতিক্রম।"
      en: "(2) A habitable room may be at most 4.25 m high. (3) A room 4.25 to 6.00 m high adds 50% to its area; such extra area together may not exceed 10% of the FAR; where the total exceeds 10% or any room is above 6.00 m, 100% is added; the ground floor of classes A5, E, F1, F4, G and H is exempt."
  - id: s51-4-5-exclusions
    clause: "§51(4)-(5)"
    cite: s51-2-5
    title:
      bn: "FAR হিসাবে অগণনীয় উপাদান"
      en: "Elements excluded from FAR"
    summary:
      bn: "নিম্নলিখিত উপাদান FAR-হিসাবে ধরা হইবে না: উপরের সিঁড়ির ফ্লাইট; লিফট-মেশিন কক্ষ; ছাদের পানি ট্যাংক (ছাদের উপরে সর্বোচ্চ ৫ মিটার পর্যন্ত); বৈদ্যুতিক ও যান্ত্রিক কক্ষ; পার্কিং (সূচি-৪ অনুসারে সর্বোচ্চ দ্বিগুণ; ড্রাইভওয়ে, র‍্যাম্প ও লিফটসহ); ড্রাইভার-অপেক্ষা কক্ষ ও শৌচাগার (≤৫%); নিরাপত্তা কক্ষ (≤৫ বর্গমিটার); ক্যান্টিলিভার ব্যালকনি (তলার ক্ষেত্রফলের ≤২.৫%); §46(5)(ঘ) অনুসারে সম্মুখ ব্যালকনির ছাড়কৃত অংশ; শিক্ষা প্রতিষ্ঠানের নীচতলার আবৃত-উন্মুক্ত স্থান; B1-এ ≤২০% এবং B2-এ ≤৪০% নীচতলার উন্মুক্ত স্থান; টেরেস/ছাদ/পার্গোলা; কাড় (Loft), যাহা কক্ষে রূপান্তরযোগ্য নহে; আলো-বাতাসের খাদ, যাহা হ্রাসযোগ্য নহে; নিজস্ব রাস্তা, যাহা প্লট-আয়তনে গণ্য নহে; অগ্নি-নিরাপত্তা সিঁড়ি (তবে একক-সিঁড়ির ইমারত অযোগ্য)।"
      en: "The following are not counted in FAR: the top stair flight; the lift machine room; roof water tanks (up to 5 m above the roof); electrical and mechanical rooms; parking (up to twice Schedule 4; including driveways, ramps and lifts); driver waiting room and toilet (up to 5%); security post (up to 5 sqm); cantilever balconies (up to 2.5% of the floor area); the front-balcony allowance under §46(5)(gha); educational ground-floor covered-open space; B-1 up to 20% and B-2 up to 40% ground-floor open space; terrace/roof/pergola; the loft (not convertible into a room); light and air wells (not reducible); private roads (not part of the plot area); fire stairs (a single-stair building is not eligible)."
  - id: s51-6-8
    clause: "§51(6)-(8)"
    cite: s51-6-8
    title:
      bn: "ঘন এলাকার FAR, নিম্ন-আয় আবাসন ও হিসাবভুক্তি"
      en: "Dense-area FAR, low-income housing and floor-area accounting"
    summary:
      bn: "(৬) ঘনবসতিপূর্ণ/নগর উন্নয়ন এলাকায় FAR-এর সর্বোচ্চ সীমা সারণি-৩-এর সংশ্লিষ্ট সারি অনুযায়ী; ইউডিসি ভিন্ন মান নির্ধারণ করিতে পারিবে। (৭) নিম্ন-আয়ের ও দুস্থ আবাসন প্রকল্পে ইউডিসি পর্যালোচনা-সাপেক্ষে মান পরিবর্তনযোগ্য। (৮) পার্কিং এবং §51(5)-এ ছাড়প্রাপ্ত উপাদানসমূহ তলা-ক্ষেত্রফলে (floor area) যোগ করিয়া হিসাব করিতে হইবে।"
      en: "(6) The FAR ceiling in dense urban development areas follows the relevant row of Tables 3; the UDC may set different values. (7) For low-income and distressed housing the UDC may vary the values on review. (8) Parking and the elements exempted under §51(5) must be included when computing floor area."
  - id: s51-9-14-road-width
    clause: "§51(9)-(15)"
    cite: s51-9-14
    title:
      bn: "সরু রাস্তার FAR এবং রাস্তা-প্রস্থ বোনাস"
      en: "Narrow-road FAR and road-width bonus"
    summary:
      bn: "(৯) ৩.৬৫–৫.৯৯ মিটার রাস্তা: FAR ৩.০০, MGC ৬৫%। (১০) ২.৫০–৩.৬৪ মিটার রাস্তা: FAR ২.০০, MGC ৬৫%। (১১) ৬.০০ হইতে ২৪.০০ মিটার পর্যন্ত রাস্তায় প্রতি অতিরিক্ত ০.৩০ মিটার প্রশস্ততার জন্য FAR ০.০৫ বৃদ্ধি; তবে §54(7) অনুসারে পরবর্তী সারণি-ধাপ ছাড়াইয়া নহে। (১২) ২৪ মিটারের ঊর্ধ্ব রাস্তায় ২৪ মিটার সারি প্রযোজ্য। (১৩) ব্যবহার-পরিবর্তনে দুই ব্যবহারের নিম্নতর FAR প্রযোজ্য। (১৪) ১৮ ও ২৪ মিটার সারিতে 'NR' অর্থ FAR-সীমা নাই; অথবা জমির আকার-ভিত্তিক সারির মানও গ্রহণযোগ্য। (১৫) নিম্নতর সারণি ('নিম্নের ছক') ব্যবহার করিলে §51(11)-এর রাস্তা-বোনাস পরিত্যক্ত হইবে (একটি শব্দ এই সংস্করণে পাঠযোগ্য নহে — দেখুন candidates C6)।"
      en: "(9) Roads 3.65-5.99 m: FAR 3.00, MGC 65%. (10) Roads 2.50-3.64 m: FAR 2.00, MGC 65%. (11) For roads 6.00 to 24.00 m, FAR rises by 0.05 for each extra 0.30 m of width, not beyond the next table step, per §54(7). (12) Above 24 m the 24 m row applies. (13) On a change of use the lower of the two uses' FAR applies. (14) 'NR' in the 18 m and 24 m rows means no FAR cap; the area-based row may also be used. (15) Using the lower table forfeits the §51(11) road-width bonus (one word unreadable in this edition - see candidates C6)."
    data:
      stepFAR: 0.05
      stepRoadM: 0.30
      farRoad365to599: 3.00
      farRoad250to364: 2.00
      mgcNarrowRoadsPercent: 65.0
  - id: s52-aviation-light
    clause: "§52"
    cite: s52
    title:
      bn: "উচ্চতা, বিমান ও টেলিযোগাযোগ সীমা, লাল বাতি"
      en: "Height, aviation and telecom limits, red light"
    summary:
      bn: "(১) ইমারতের উচ্চতা মহাপরিকল্পনার বিধান অনুযায়ী নির্ধারিত। (২) বিমানবন্দর, মাইক্রোওয়েভ ও টেলিযোগাযোগের গুরুত্বপূর্ণ স্থাপনার নিকটে উচ্চতার সীমা সংশ্লিষ্ট কর্তৃপক্ষের সহিত সমন্বয়ে নির্ধারিত হইবে (এই উপ-ধারার একটি শব্দ এই সংস্করণে পাঠযোগ্য নহে — দেখুন candidates C10)। (৩) কর্তৃপক্ষ নদী, জলাশয়, উদ্যান এবং ঐতিহাসিক বা বিশেষ গুরুত্বপূর্ণ এলাকার নিকটে উচ্চতা সীমাবদ্ধ করিতে পারিবে। (৪) ৪৫.৭০ মিটার বা তদূর্ধ্ব উচ্চতার ইমারত বা স্থাপনার শীর্ষে লাল নিরাপত্তা বাতি স্থাপন করিতে হইবে।"
      en: "(1) Building height follows the Master Plan provisions. (2) Near airports and critical microwave and telecommunication installations the height limit is fixed in coordination with the authority concerned (one word unreadable in this edition - see candidates C10). (3) The authority may restrict heights near rivers, water bodies, gardens and historical or specially important areas. (4) A building or installation 45.70 m or more in height must carry a red safety light at its top."
    data:
      redLightThresholdM: 45.70
  - id: s53-safety
    clause: "§53"
    cite: s53
    title:
      bn: "তলা ও বেসমেন্ট — নামকরণ ও নিরাপত্তা"
      en: "Floors and basements - naming and safety"
    summary:
      bn: "(১) তলাসমূহের নামকরণ: বেসমেন্ট, সেমি-বেসমেন্ট, নীচতলা (Ground Floor), দ্বিতীয় তলা (First Floor), তৃতীয় তলা (Second Floor), ছাদ ইত্যাদি। (২)(ক) বেসমেন্টে যান্ত্রিক বায়ু চলাচল, আলো ও পরিচ্ছন্নতা নিশ্চিত করিতে হইবে; (খ) বৃষ্টির পানি ও অন্যান্য পানির অনুপ্রবেশ রোধ করিতে হইবে; (গ) ব্যবহারকারীর সংখ্যা ও ভ্রমণ-দূরত্ব বিবেচনায় সিঁড়ির সংখ্যা নির্ধারণ করিতে হইবে; (ঘ) বেসমেন্টের নির্মাণ কাজ শুরু হইবার ৯০ (নব্বই) দিনের মধ্যে সকল নিরাপত্তামূলক ব্যবস্থা সম্পন্ন করিয়া লইতে হইবে, অন্যথায় কর্তৃপক্ষ নির্মাণ বন্ধ করিয়া দিতে পারিবে; (ঙ) প্রতিবেশীর ইমারত ও জনগণের নিরাপত্তা ও সুবিধাদি রক্ষার ব্যবস্থা সহ ক্ষতিপূরণ-বন্ধ (indemnity bond, সংযুক্তি-৩০১) দাখিল করিতে হইবে (একটি শব্দ এই সংস্করণে পাঠযোগ্য নহে — দেখুন candidates C10); (চ) এসি সুবিধাসহ বেসমেন্টে অনাবাসিক ব্যবহার চলিতে পারিবে।"
      en: "(1) Floors are named: basement, semi-basement, ground floor, first floor, second floor, roof etc. (2)(ka) The basement must have mechanical ventilation, light and cleanliness; (kha) rain and other water ingress must be prevented; (ga) the number of stairs is set by users and travel distance; (gha) all safety measures must be completed within 90 (ninety) days of starting basement construction, failing which the authority may stop the work; (nga) the safety and amenities of neighbouring buildings and the public must be provided for, with an indemnity bond (Sanjukti-301) filed (one word unreadable in this edition - see candidates C10); (cha) a basement with air conditioning may be put to non-residential use."
    data:
      basementSafetyDays: 90
      indemnityBondForm: "সংযুক্তি-৩০১"
  - id: s54-1-5-approval
    clause: "§54(1)-(5)"
    cite: s54-1-5
    title:
      bn: "অনুমোদনের ন্যূনতম রাস্তা ও প্রশস্তকরণ"
      en: "Minimum road for approval and widening"
    summary:
      bn: "(১) অনুমোদনের জন্য সংলগ্ন রাস্তা ন্যূনতম ৬.০০ মিটার (ফুটপাতসহ); তবে §48(3)(4)(5) এবং §51(9)(10)-এর অধীন FAR-এর ক্ষেত্রে প্রযোজ্য নহে। (২) ড্যাপ-ভুক্ত রাস্তা ৬.০০ মিটারের কম হইলে অর্ধেক জমি হস্তান্তরের অঙ্গীকারপত্র দাখিল করিয়া রাস্তা ৬.০০ মিটারে উন্নীত করিতে হইবে; আবেদন পূর্বে করিয়া নির্মাণ পরে করিতে হইবে। (৩) হস্তান্তরের পর অবশিষ্ট জমির উপর হিসাব করিতে হইবে। (৪) ৬.০০ মিটারে উন্নীত করিতে ন্যূনতম ০.৩০ মিটার প্রস্থের জমি দিলে FAR ০.০৫ করিয়া বৃদ্ধি পাইবে (সর্বোচ্চ ০.২০)। (৫) ৬.০০ মিটারের বেশি অংশ গণনায় আসিবে না।"
      en: "(1) Approval requires an adjoining road of at least 6.00 m including footpath; not required for FAR under §48(3)(4)(5) or §51(9)(10). (2) Where a DAP road is under 6.00 m, an undertaking to hand over half the land for widening to 6.00 m must be filed; the application comes first and construction after. (3) The computation is made on the remaining plot. (4) Land strips of at least 0.30 m given for widening to 6.00 m raise FAR by 0.05 each, up to 0.20. (5) The part beyond 6.00 m is not counted."
    data:
      minRoadM: 6.0
      widenStepFAR: 0.05
      widenStepM: 0.30
      widenMaxFAR: 0.20
  - id: s54-6-9
    clause: "§54(6)-(9)"
    cite: s54-6-9
    title:
      bn: "নিজস্ব রাস্তা, অ-তালিকাভুক্ত ক্ষেত্র, ফুটপাত"
      en: "Private roads, unlisted cases, footpaths"
    summary:
      bn: "(৬) বেসরকারি আবাসন প্রকল্পের অভ্যন্তরীণ রাস্তা ইমারত নির্মাণ বিধিমালা ২০০৪ অনুসারে; ৭.৬২ মিটারের কম প্রস্থের রাস্তা সংশোধন করিতে হইবে। (৭) প্রযোজ্য তালিকায় না থাকা ক্ষেত্রে রাস্তাভিত্তিক ও আকারভিত্তিক হিসাবের মধ্যে নিম্নতর FAR এবং সংশ্লিষ্ট সারণির MGC প্রযোজ্য; §51(11)-এর রাস্তা-বোনাসও প্রয়োগযোগ্য। (৮) নতুন প্রবেশ-রাস্তা নির্মাণে ফুটপাত রহিতে হইবে। (৯) ফুটপাত নির্মাণ ও রক্ষণাবেক্ষণ কর্তৃপক্ষের শর্তের অধীন।"
      en: "(6) Internal roads of private housing projects follow the Imarat Nirman Bidhimala 2004; roads under 7.62 m must be corrected. (7) For unlisted cases the lower of the road-based and area-based FAR applies, with that table's MGC; the §51(11) road-width bonus also applies. (8) New access roads must carry footpaths. (9) Footpath construction and maintenance are subject to the authority's terms."
  - id: s55-corner-clear-zone
    clause: "§55"
    cite: s55
    title:
      bn: "কর্নার ক্লিয়ার জোন"
      en: "Corner clear zone"
    summary:
      bn: "কর্নার প্লটে দুই রাস্তার সংযোগস্থলের কোণে ১.৫০ মিটার × ১.৫০ মিটার অংশ উন্মুক্ত রাখিতে হইবে; এই অংশে কোনো প্রকার নির্মাণ করা যাইবে না।"
      en: "At the corner of two roads on a corner plot, a 1.50 m x 1.50 m area must stay clear; no construction of any kind may occupy it."
    data:
      cornerClearZoneM: 1.5
  - id: s57-mixed-use
    clause: "§57"
    cite: s57
    title:
      bn: "মিশ্র ব্যবহার"
      en: "Mixed use"
    summary:
      bn: "(১) মিশ্র ব্যবহারে আবাসিক ব্যবহারের সংশ্লিষ্ট বিধি FAR ও MGC হিসাবে এবং সূচি-৪ পার্কিং হিসেবে প্রযোজ্য। (২) অন্যান্য ক্ষেত্রে শ্রেণীসমূহের মধ্যে সর্বাধিক কঠোর শর্তাবলি (Stringent Requirements) প্রযোজ্য; কোনো এক শ্রেণীর ব্যবহার মোট তলা-ক্ষেত্রফলের (পার্কিং বাদে) ১০% বা তদূর্ধ্ব হইলে সেই শ্রেণীর বিধানাবলিও প্রযোজ্য। (৩) প্রশস্ত রাস্তার সংলগ্ন প্লটে অনাবাসিক ব্যবহারের প্রবেশ কেবল সেই রাস্তা হইতে; কর্নার প্লটে আবাসিক ব্যবহারের জন্য যেকোনো রাস্তা ব্যবহারযোগ্য। (৪) সংলগ্ন আবাসিক জমির দিকে ন্যূনতম ২.৫০ মিটার সেটব্যাক রাখিতে হইবে। (৫) আবাসিক ইমারতের জানালা ও বারান্দা অন্য ব্যবহারের দিকে থাকিতে পারিবে; অনাবাসিক ইমারতের বারান্দা আবাসিক দিকে থাকিতে পারিবে না।"
      en: "(1) In mixed use, the residential provisions apply for FAR and MGC, and Schedule 4 for parking. (2) Otherwise the most stringent requirements among the classes apply; where any one class occupies 10% or more of the total floor area (excluding parking), that class's provisions also apply. (3) On a plot beside a wide road, non-residential use may be accessed only from that road; on a corner plot residential use may use either road. (4) A minimum 2.50 m setback must be kept towards adjoining residential land. (5) Residential windows and verandas may face the other use; non-residential verandas may not face the residential side."
    data:
      adjoiningSetbackM: 2.5
      dominantClassSharePercent: 10
