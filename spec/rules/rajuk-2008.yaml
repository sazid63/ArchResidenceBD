gaps:
  - id: gap-c1
    what: "§46(5)(ক): one word in the sentence on the permitted roofed structure over the paved MOS (the sentence carrying the 50% soil-retention condition) is not readable from this edition."
    why: "Legacy-font render is unclear; the word is not asserted in the pack to avoid inventing law. See candidates C1."
    candidateRef: C1
  - id: gap-c3
    what: "Schedule 4 notes: one word in the motorcycle/car parking condition for flats up to 90 sqm is not readable with certainty."
    why: "Unread word not asserted; parking note s4-n-small-flat-word carries the marker. See candidates C3."
    candidateRef: C3
  - id: gap-c4
    what: "Appendix 5 (definitions) is not transcribed."
    why: "Definitional terms are needed before the rule engine interprets open space, covered area etc.; deferred. See candidates C4."
    candidateRef: C4
  - id: gap-c6
    what: "§51(11): whether a partial 0.30 m step earns a pro-rata FAR bonus is not settled by the text; §51(15): the ম্ন conjunct glyph of 'নিম্নের ছক' is missing in this edition."
    why: "Working reading (full steps only, capped at the next table step) needs engineer confirmation; the missing glyph makes the (15) word probable, not proven. See candidates C6."
    candidateRef: C6
  - id: gap-c8
    what: "Amendments to the 2008 Bidhimala published after 2008 are not researched."
    why: "The pack encodes the 2008 text as printed; amendments must be obtained and diffed before the pack can leave candidate status. See candidates C8."
    candidateRef: C8
  - id: gap-c9
    what: "The 2025-12-14 DAP FAR reform is recorded as metadata only; its primary document is not obtained and nothing from it is encoded."
    why: "Quality law: no unsourced values. The app must keep surfacing that a newer regime may apply. See candidates C9."
    candidateRef: C9
  - id: gap-c10
