[package]
name = "archresidencebd"
version = "1.0.0"
description = "AI-powered civil engineering assistant for Bangladeshi residential buildings"
authors = ["Sazid Hossain <sazid63@users.noreply.github.com>"]
license = "MIT"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url", "process-relaunch-dangerous-allow-symlink-macos"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "archresidencebd_lib"
path = "src/lib.rs"

[[bin]]
name = "archresidencebd"
path = "src/main.rs"

