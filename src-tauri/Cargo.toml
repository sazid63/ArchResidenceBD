[package]
name = "archresidencebd"
version = "3.0.0"
description = "Residential building screening for Dhaka: plan, compliance, structure, rebar, BOQ and drawings"
authors = ["Sazid Hossain <sazid63@users.noreply.github.com>"]
license = "MIT"
edition = "2021"
build = "src/build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["webview-data-url", "process-relaunch-dangerous-allow-symlink-macos"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[lib]
name = "archresidencebd_lib"
path = "src/lib.rs"

[[bin]]
name = "archresidencebd"
path = "src/main.rs"

